<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Purple Sci-Fi Stream Overlay - OBS Optimized</title>
<!--
  OBS-optimized version.
  Main performance changes:
  - JavaScript particle loop is capped with CONFIG.render.targetFps.
  - Particle canvas renders internally at CONFIG.render.canvasRenderScale.
  - Default particle count, connection distance, glow, and signal lines are reduced.
  - CSS background-position/blur/drop-shadow effects are reduced in obs mode.
  - Notification popups default to one active panel and slower scan animation.
-->

<style>
/* =========================================================
   00. GLOBAL DESIGN SETTINGS
   ---------------------------------------------------------
   The overlay is built on a fixed 1920x1080 canvas.
   JavaScript scales the entire overlay uniformly so it never
   stretches or distorts.
========================================================= */

:root {
  --overlay-width: 1920px;
  --overlay-height: 1080px;

  --global-glow-strength: 0.7;
}


/* =========================================================
   00A. COLOR MODE SETTINGS
   ---------------------------------------------------------
   This file supports two visual modes:

   normal:
   - original purple / white look

   inverted:
   - brand-safe inverted look
   - darker violet lines and darker frame details
   - better visibility over mostly white or mostly purple scenes

   Change the mode in the JavaScript CONFIG section:
   colorMode: "normal"
   colorMode: "inverted"
========================================================= */

:root,
:root[data-color-mode="normal"] {
  --purple-dark: #16001f;
  --purple-main: #60156c;
  --purple-bright: #b340ff;
  --purple-soft: #d98cff;
  --white: #ffffff;

  --purple-main-rgb: 96, 21, 108;
  --purple-bright-rgb: 179, 64, 255;
  --purple-soft-rgb: 217, 140, 255;
  --white-rgb: 255, 255, 255;

  --bar-color-a: var(--purple-main);
  --bar-color-b: var(--white);
  --bar-color-c: var(--purple-bright);

  --corner-color: #ffffff;
  --tech-color-a: var(--purple-bright);
  --tech-color-b: var(--white);

  --grid-rgb: var(--purple-bright-rgb);
  --edge-glow-a-rgb: var(--purple-bright-rgb);
  --edge-glow-b-rgb: var(--white-rgb);
  --edge-glow-side-rgb: var(--purple-main-rgb);

  --scan-color-a-rgb: var(--white-rgb);
  --scan-color-b-rgb: var(--purple-bright-rgb);

  --data-border-rgb: var(--purple-soft-rgb);
  --data-white-rgb: var(--white-rgb);
  --data-purple-rgb: var(--purple-bright-rgb);

  --glow-rgb: var(--purple-bright-rgb);
  --shine-color: var(--white);
}

:root[data-color-mode="inverted"] {
  --purple-dark: #ffffff;
  --purple-main: #d98cff;
  --purple-bright: #16001f;
  --purple-soft: #60156c;
  --white: #16001f;

  --purple-main-rgb: 217, 140, 255;
  --purple-bright-rgb: 22, 0, 31;
  --purple-soft-rgb: 96, 21, 108;
  --white-rgb: 22, 0, 31;

  --bar-color-a: #ffffff;
  --bar-color-b: #16001f;
  --bar-color-c: #60156c;

  --corner-color: #ffffff;
  --tech-color-a: #16001f;
  --tech-color-b: #ffffff;

  --grid-rgb: 22, 0, 31;
  --edge-glow-a-rgb: 22, 0, 31;
  --edge-glow-b-rgb: 255, 255, 255;
  --edge-glow-side-rgb: 22, 0, 31;

  --scan-color-a-rgb: 22, 0, 31;
  --scan-color-b-rgb: 255, 255, 255;

  --data-border-rgb: 22, 0, 31;
  --data-white-rgb: 255, 255, 255;
  --data-purple-rgb: 22, 0, 31;

  --glow-rgb: 255, 255, 255;
  --shine-color: #16001f;
}


/* =========================================================
   01. FULL-OVERLAY SCAN LINE SETTINGS
   ---------------------------------------------------------
   Creates a horizontal light band that sweeps downward
   across the entire overlay.
========================================================= */

:root {
  --overlay-scan-height: 70px;
  --overlay-scan-opacity: 0.28;
  --overlay-scan-blur: 6px;
  --overlay-scan-duration: 8.5s;
}


/* =========================================================
   02. OUTER FRAME SETTINGS
========================================================= */

:root {
  --outer-margin-x: 70px;
  --outer-bar-top: 42px;
  --outer-bar-bottom: 42px;
  --outer-bar-height: 3px;

  --corner-size: 120px;
  --corner-offset: 42px;
  --corner-border-width: 4px;
}


/* =========================================================
   03. BACKGROUND GRID SETTINGS
========================================================= */

:root {
  --grid-size: 48px;
  --grid-opacity: 0.32;
  --grid-line-opacity: 0.052;
}


/* =========================================================
   04. TECH LINE SETTINGS
========================================================= */

:root {
  --tech-line-height: 2px;
  --tech-line-opacity: 0.58;

  --tech-line-one-width: 360px;
  --tech-line-one-top: 210px;
  --tech-line-one-left: 115px;

  --tech-line-two-width: 270px;
  --tech-line-two-top: 330px;
  --tech-line-two-right: 160px;

  --tech-line-three-width: 420px;
  --tech-line-three-bottom: 245px;
  --tech-line-three-left: 250px;
}


/* =========================================================
   05. VERTICAL DATA STRIP SETTINGS
========================================================= */

:root {
  --data-strip-right: 42px;
  --data-strip-top: 190px;
  --data-strip-width: 22px;
  --data-strip-height: 520px;
  --data-strip-opacity: 0.58;
}


/* =========================================================
   05A. EVE / GALLENTE NOTIFICATION SETTINGS
   ---------------------------------------------------------
   Toggle this feature in JavaScript:
   CONFIG.eveNotifications.enabled = true / false

   These panels only appear in the left third or right third
   of the fixed 1920x1080 design canvas.
========================================================= */

:root {
  --eve-panel-width: 390px;
  --eve-panel-min-height: 86px;

  --eve-panel-left-x: 92px;
  --eve-panel-right-x: 1438px;

  --eve-panel-top-min: 135px;
  --eve-panel-top-max: 790px;

  --eve-panel-border-opacity: 0.88;
  --eve-panel-background-opacity: 0.34;
  --eve-panel-glow-opacity: 0.45;

  --eve-panel-title-size: 13px;
  --eve-panel-body-size: 15px;
  --eve-panel-meta-size: 11px;

  /*
    Panel readability controls.
    Increase backdrop opacity if the game footage behind the overlay is busy.
  */
  --eve-panel-backdrop-opacity: 0.74;
  --eve-panel-text-shadow-opacity: 0.95;
  --eve-panel-letter-spacing: 0.8px;

  /*
    Type-based UI adjustments.
  */
  --eve-panel-default-bar-width: 7px;
  --eve-panel-default-radius: 0px;

  /*
    Internal popup scan controls.

    sweep-width controls how wide the moving bright band is.
    sweep-opacity controls how visible it is.
    texture-opacity controls the subtle sci-fi line texture.
  */
  --eve-panel-sweep-width: 78%;
  --eve-panel-sweep-opacity: 0.48;
  --eve-panel-texture-opacity: 0.14;
  --eve-panel-scan-duration: 4.4s;
}


/* =========================================================
   06. PAGE RESET
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   07. VIEWPORT AND NON-DISTORTING 16:9 OVERLAY CANVAS
   ---------------------------------------------------------
   The overlay starts at top-left.
   Extra space appears on the right or bottom.
========================================================= */

.viewport {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: transparent;
}

.overlay {
  position: absolute;
  width: var(--overlay-width);
  height: var(--overlay-height);
  left: 0;
  top: 0;
  transform-origin: top left;
  transform: scale(1);
  overflow: hidden;
  background: transparent;
  pointer-events: none;
}


/* =========================================================
   08. CANVAS PARTICLE NETWORK LAYER
========================================================= */

#particleCanvas {
  position: absolute;
  inset: 0;
  width: var(--overlay-width);
  height: var(--overlay-height);
  opacity: 1;
  pointer-events: none;
}


/* =========================================================
   09. BACKGROUND GRID
========================================================= */

.grid {
  position: absolute;
  inset: 0;
  will-change: background-position;
  background:
    linear-gradient(
      rgba(var(--grid-rgb), var(--grid-line-opacity)) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(var(--grid-rgb), var(--grid-line-opacity)) 1px,
      transparent 1px
    );
  background-size: var(--grid-size) var(--grid-size);
  mask-image: radial-gradient(circle at 68% 55%, transparent 0%, black 42%, black 100%);
  opacity: var(--grid-opacity);
  animation: gridDrift 12s linear infinite;
}


/* =========================================================
   10. EDGE GLOW
========================================================= */

.edge-glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 8% 12%, rgba(var(--edge-glow-a-rgb), 0.38), transparent 18%),
    radial-gradient(circle at 92% 82%, rgba(var(--edge-glow-b-rgb), 0.2), transparent 18%),
    linear-gradient(
      90deg,
      rgba(var(--edge-glow-side-rgb), 0.38),
      transparent 28%,
      transparent 72%,
      rgba(var(--edge-glow-side-rgb), 0.38)
    );
  opacity: 0.78;
}


/* =========================================================
   11. FULL-OVERLAY SCAN LINE
========================================================= */

.overlay-scan {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.overlay-scan::after {
  content: "";
  position: absolute;
  will-change: transform, opacity;
  left: 0;
  right: 0;
  top: calc(var(--overlay-scan-height) * -1);
  height: var(--overlay-scan-height);
  background:
    linear-gradient(
      180deg,
      rgba(var(--scan-color-a-rgb), 0),
      rgba(var(--scan-color-a-rgb), 0.16),
      rgba(var(--scan-color-b-rgb), var(--overlay-scan-opacity)),
      rgba(var(--scan-color-a-rgb), 0.2),
      rgba(var(--scan-color-a-rgb), 0)
    );
  filter: blur(var(--overlay-scan-blur));
  animation: overlayScanDown var(--overlay-scan-duration) linear infinite;
  opacity: 0.9;
}


/* =========================================================
   12. TOP AND BOTTOM OUTER BARS
========================================================= */

.top-bar,
.bottom-bar {
  position: absolute;
  left: var(--outer-margin-x);
  right: var(--outer-margin-x);
  height: var(--outer-bar-height);
  background: linear-gradient(
    90deg,
    transparent,
    var(--bar-color-a),
    var(--bar-color-b),
    var(--bar-color-c),
    transparent
  );
  box-shadow:
    0 0 calc(8px * var(--global-glow-strength)) rgba(var(--glow-rgb), 1),
    0 0 calc(18px * var(--global-glow-strength)) rgba(var(--glow-rgb), 0.7);
  opacity: 0.92;
}

.top-bar {
  top: var(--outer-bar-top);
}

.bottom-bar {
  bottom: var(--outer-bar-bottom);
}

.top-bar::before,
.bottom-bar::before {
  content: "";
  position: absolute;
  top: -2px;
  left: -220px;
  width: 180px;
  height: 7px;
  background: linear-gradient(90deg, transparent, var(--shine-color), transparent);
  filter: blur(1px);
  animation: lightSweep 4s linear infinite;
  will-change: transform;
}


/* =========================================================
   13. OUTER CORNER BRACKETS
========================================================= */

.corner {
  position: absolute;
  width: var(--corner-size);
  height: var(--corner-size);

  /*
    Important:
    The individual corner rules use border shorthand like:
    border-top: 4px solid;

    Without color: var(--corner-color), that shorthand can render using
    currentColor, which may appear black/dark. Setting both color and
    border-color forces the brackets to use the intended corner color.
  */
  color: var(--corner-color);
  border-color: var(--corner-color);
  opacity: 0.95;
  filter:
    drop-shadow(0 0 calc(5px * var(--global-glow-strength)) rgba(var(--glow-rgb), 1))
    drop-shadow(0 0 calc(15px * var(--global-glow-strength)) rgba(var(--glow-rgb), 0.7));
}

.corner.tl {
  top: var(--corner-offset);
  left: var(--corner-offset);
  border-top: var(--corner-border-width) solid var(--corner-color);
  border-left: var(--corner-border-width) solid var(--corner-color);
}

.corner.tr {
  top: var(--corner-offset);
  right: var(--corner-offset);
  border-top: var(--corner-border-width) solid var(--corner-color);
  border-right: var(--corner-border-width) solid var(--corner-color);
}

.corner.bl {
  bottom: var(--corner-offset);
  left: var(--corner-offset);
  border-bottom: var(--corner-border-width) solid var(--corner-color);
  border-left: var(--corner-border-width) solid var(--corner-color);
}

.corner.br {
  bottom: var(--corner-offset);
  right: var(--corner-offset);
  border-bottom: var(--corner-border-width) solid var(--corner-color);
  border-right: var(--corner-border-width) solid var(--corner-color);
}


/* =========================================================
   14. ANIMATED TECH LINES
========================================================= */

.tech-lines {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.tech-line {
  position: absolute;
  will-change: transform, opacity;
  height: var(--tech-line-height);
  background: linear-gradient(90deg, transparent, var(--tech-color-a), var(--tech-color-b), transparent);
  box-shadow: 0 0 8px rgba(var(--glow-rgb), 1);
  opacity: var(--tech-line-opacity);
  animation: techFlow 5s linear infinite;
}

.tech-line.one {
  width: var(--tech-line-one-width);
  top: var(--tech-line-one-top);
  left: var(--tech-line-one-left);
}

.tech-line.two {
  width: var(--tech-line-two-width);
  top: var(--tech-line-two-top);
  right: var(--tech-line-two-right);
  animation-delay: 1.1s;
}

.tech-line.three {
  width: var(--tech-line-three-width);
  bottom: var(--tech-line-three-bottom);
  left: var(--tech-line-three-left);
  animation-delay: 2.1s;
}


/* =========================================================
   15. VERTICAL DATA STRIP
========================================================= */

.vertical-data {
  position: absolute;
  right: var(--data-strip-right);
  top: var(--data-strip-top);
  width: var(--data-strip-width);
  height: var(--data-strip-height);
  border-left: 1px solid rgba(var(--data-border-rgb), 0.42);
  border-right: 1px solid rgba(var(--data-border-rgb), 0.42);
  overflow: hidden;
  opacity: var(--data-strip-opacity);
}

.vertical-data::before {
  content: "";
  position: absolute;
  will-change: transform;
  inset: -100% 0 0 0;
  background: repeating-linear-gradient(
    180deg,
    transparent 0 18px,
    rgba(var(--data-white-rgb), 0.75) 18px 22px,
    rgba(var(--data-purple-rgb), 0.85) 22px 30px
  );
  animation: dataFall 2.2s linear infinite;
}


/* =========================================================
   15A. EVE / GALLENTE NOTIFICATION PANELS
   ---------------------------------------------------------
   The panels are generated by JavaScript and inserted into
   .eve-notification-layer. They use the same color-mode
   variables as the rest of the overlay.

   Each popup can also receive a type class:
   - type-news
   - type-traffic
   - type-gallente
   - type-flirt
   - type-emergency
   - type-bounty
========================================================= */

.eve-notification-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.eve-popup {
  position: absolute;
  width: var(--eve-panel-width);
  min-height: var(--eve-panel-min-height);
  padding: 16px 20px 16px 20px;

  /*
    Default typed-style variables. These are overridden per type.
  */
  --panel-accent-rgb: 179, 64, 255;
  --panel-accent-soft-rgb: 217, 140, 255;
  --panel-bright-rgb: 255, 255, 255;
  --panel-dark-top: 12, 4, 18;
  --panel-dark-bottom: 26, 8, 42;
  --panel-border-rgb: 217, 140, 255;
  --panel-glow-rgb: 179, 64, 255;
  --panel-badge-rgb: 217, 140, 255;
  --panel-meta-rgb: 217, 140, 255;
  --panel-bar-width: var(--eve-panel-default-bar-width);
  --panel-width: var(--eve-panel-width);

  width: var(--panel-width);
  border: 1px solid rgba(var(--panel-border-rgb), 0.92);
  background:
    linear-gradient(
      135deg,
      rgba(var(--panel-dark-top), calc(var(--eve-panel-background-opacity) + 0.08)),
      rgba(var(--panel-dark-bottom), calc(var(--eve-panel-background-opacity) + 0.03))
    );
  box-shadow:
    inset 0 0 22px rgba(var(--panel-accent-rgb), 0.16),
    0 0 20px rgba(var(--panel-glow-rgb), 0.42),
    0 0 36px rgba(var(--panel-glow-rgb), 0.18);
  clip-path: polygon(
    0 0,
    calc(100% - 26px) 0,
    100% 26px,
    100% 100%,
    24px 100%,
    0 calc(100% - 24px)
  );
  overflow: hidden;
  opacity: 0;
  transform: translate3d(0, 8px, 0);
  backface-visibility: hidden;
  transition:
    opacity var(--eve-enter-duration, 140ms) ease-out,
    transform var(--eve-enter-duration, 140ms) ease-out;
  will-change: opacity, transform;
}

.eve-popup.is-visible {
  opacity: 1;
  transform: translate3d(0, 0, 0);
}

.eve-popup.is-hiding {
  opacity: 0;
  transform: translate3d(0, -8px, 0);
  transition:
    opacity var(--eve-exit-duration, 260ms) ease-in,
    transform var(--eve-exit-duration, 260ms) ease-in;
}

.eve-popup[data-side="left"] {
  left: var(--eve-panel-left-x);
}

.eve-popup[data-side="right"] {
  left: var(--eve-panel-right-x);
}

.eve-popup::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  background:
    linear-gradient(
      180deg,
      rgba(var(--panel-dark-top), var(--eve-panel-backdrop-opacity)),
      rgba(var(--panel-dark-bottom), calc(var(--eve-panel-backdrop-opacity) * 0.82))
    );
  opacity: 0.98;
}

.eve-popup::after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  z-index: 3;
  width: var(--panel-bar-width);
  height: 100%;
  background: linear-gradient(
    180deg,
    rgba(var(--panel-bright-rgb), 0.18),
    rgba(var(--panel-accent-rgb), 0.97),
    rgba(var(--panel-bright-rgb), 0.18)
  );
  box-shadow:
    0 0 8px rgba(var(--panel-glow-rgb), 0.95),
    0 0 16px rgba(var(--panel-glow-rgb), 0.65);
}

/*
  Static texture layer.

  This does NOT slide the whole backing panel anymore. It only drifts
  a small texture pattern so the panel stays continuously covered.
*/
.eve-popup-scan {
  position: absolute;
  inset: 0;
  will-change: background-position;
  z-index: 1;
  pointer-events: none;
  opacity: var(--eve-panel-texture-opacity);
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 14px,
      rgba(var(--panel-bright-rgb), 0.075) 14px 16px
    );
  background-size: 32px 100%;
  animation: evePanelTextureDrift var(--eve-panel-scan-duration) linear infinite;
}

/*
  Main visible horizontal sweep.

  This is the effect that moves across the message. It starts fully
  off-panel on the left and ends fully off-panel on the right, so it
  visibly passes through the full popup instead of appearing only on
  the left and right sections.
*/
.eve-popup-sweep {
  position: absolute;
  top: -18%;
  will-change: transform;
  bottom: -18%;
  left: 0;
  z-index: 1;
  width: var(--eve-panel-sweep-width);
  pointer-events: none;
  opacity: var(--eve-panel-sweep-opacity);
  background:
    linear-gradient(
      90deg,
      transparent 0%,
      rgba(var(--panel-bright-rgb), 0.10) 12%,
      rgba(var(--panel-accent-rgb), 0.24) 24%,
      rgba(var(--panel-bright-rgb), 0.48) 42%,
      rgba(var(--panel-accent-rgb), 0.38) 52%,
      rgba(var(--panel-bright-rgb), 0.30) 60%,
      rgba(var(--panel-accent-rgb), 0.20) 72%,
      transparent 100%
    );
  filter: blur(2px);
  transform: translate3d(-120%, 0, 0) skewX(-14deg);
  animation: evePanelFullSweep var(--eve-panel-scan-duration) linear infinite;
}

.eve-popup-sweep::after {
  content: "";
  position: absolute;
  left: 46%;
  top: 8%;
  bottom: 8%;
  width: 2px;
  background:
    linear-gradient(
      180deg,
      transparent,
      rgba(var(--panel-bright-rgb), 0.92),
      rgba(var(--panel-accent-rgb), 0.92),
      transparent
    );
  box-shadow:
    0 0 8px rgba(var(--panel-bright-rgb), 0.9),
    0 0 18px rgba(var(--panel-accent-rgb), 0.72);
  opacity: 0.95;
}

.eve-popup-header,
.eve-popup-body,
.eve-popup-meta {
  position: relative;
  z-index: 2;
}

.eve-popup-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 9px;
}

.eve-popup-title {
  color: #ffffff;
  font-size: var(--eve-panel-title-size);
  font-weight: 700;
  letter-spacing: 2.4px;
  text-transform: uppercase;
  text-shadow:
    0 1px 2px rgba(0, 0, 0, var(--eve-panel-text-shadow-opacity)),
    0 0 7px rgba(var(--panel-bright-rgb), 0.72),
    0 0 14px rgba(var(--panel-glow-rgb), 0.78);
  white-space: nowrap;
}

.eve-popup-badge {
  color: rgba(var(--panel-badge-rgb), 0.98);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  text-shadow:
    0 1px 2px rgba(0, 0, 0, var(--eve-panel-text-shadow-opacity)),
    0 0 8px rgba(var(--panel-glow-rgb), 0.72);
  white-space: nowrap;
}

.eve-popup-body {
  color: rgba(255, 255, 255, 0.97);
  font-size: var(--eve-panel-body-size);
  font-weight: 600;
  line-height: 1.38;
  letter-spacing: var(--eve-panel-letter-spacing);
  text-shadow:
    0 1px 2px rgba(0, 0, 0, var(--eve-panel-text-shadow-opacity)),
    0 0 5px rgba(var(--panel-glow-rgb), 0.35);
}

.eve-popup-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 11px;
  color: rgba(var(--panel-meta-rgb), 0.95);
  font-size: var(--eve-panel-meta-size);
  font-weight: 700;
  letter-spacing: 1.7px;
  text-transform: uppercase;
  text-shadow:
    0 1px 2px rgba(0, 0, 0, var(--eve-panel-text-shadow-opacity)),
    0 0 6px rgba(var(--panel-glow-rgb), 0.55);
}

.eve-popup-meta::before {
  content: "";
  width: 48px;
  height: 2px;
  background: linear-gradient(
    90deg,

    performanceMode: "obs"

      canvasRenderScale draws the particle canvas at a lower internal

    targetFps: 24,

    particleCount: 72,

    zoneMode: "outerThirds",

/* =========================================================
   00A. CANVAS COLOR THEMES
   ---------------------------------------------------------
   These are separate from the CSS variables because canvas
   drawing uses JavaScript colors directly.
========================================================= */

const CANVAS_THEMES = {
  normal: {
    /*
      White particle network for the standard mode.
    */
    particleColor: "255, 255, 255",
    lineColor: "255, 255, 255",
    whiteAccentColor: "255, 255, 255",
    particleShadowColor: "rgba(255, 255, 255, 0.82)",
    accentShadowColor: "rgba(255, 255, 255, 0.82)",
    lineShadowColor: "rgba(255, 255, 255, 0.72)",
    signalShadowColor: "rgba(255, 255, 255, 0.86)"
  },

  inverted: {
    /*
      Keep the particle network white in inverted mode too,
      so it remains consistent regardless of color mode.
    */
    particleColor: "255, 255, 255",
    lineColor: "255, 255, 255",
    whiteAccentColor: "255, 255, 255",
    particleShadowColor: "rgba(255, 255, 255, 0.82)",
    accentShadowColor: "rgba(255, 255, 255, 0.82)",
    lineShadowColor: "rgba(255, 255, 255, 0.72)",
    signalShadowColor: "rgba(255, 255, 255, 0.86)"
  }
};


/* =========================================================
   01. ELEMENT REFERENCES
========================================================= */

const overlay = document.getElementById("overlay");
const canvas = document.getElementById("particleCanvas");
const ctx = canvas.getContext("2d");
const eveNotificationLayer = document.getElementById("eveNotificationLayer");


/* =========================================================
   02. PARTICLE STATE
========================================================= */

let particles = [];
let canvasTheme = CANVAS_THEMES.normal;
let activeNotificationCount = 0;
let resizeAnimationFrame = null;
let lastAnimationTime = 0;
let canvasRenderScale = 1;
let overlayPaused = false;

const TWO_PI = Math.PI * 2;
const NOTIFICATION_TYPES = new Set([
  "news",
  "traffic",
  "gallente",
  "flirt",
  "emergency",
  "bounty"
]);


/* =========================================================
   03. COLOR MODE APPLICATION
========================================================= */

function applyVisualMode() {
  document.documentElement.dataset.colorMode = CONFIG.visual.colorMode;
  document.documentElement.dataset.performanceMode = CONFIG.visual.performanceMode;
  canvasTheme = CANVAS_THEMES[CONFIG.visual.colorMode] || CANVAS_THEMES.normal;
}

function getCanvasTheme() {
  return canvasTheme;
}


/* =========================================================
   04. NON-DISTORTING 16:9 SCALE HANDLER
   ---------------------------------------------------------
   The overlay is scaled uniformly and anchored at top-left.
   Extra space appears on the right or bottom, not equally
   around the design.
========================================================= */

function updateOverlayScale() {
  const viewportWidth = window.innerWidth;
  const viewportHeight = window.innerHeight;

  const scale = Math.min(
    viewportWidth / CONFIG.design.width,
    viewportHeight / CONFIG.design.height
  );

  overlay.style.transform = `scale(${scale})`;
}

function requestOverlayScaleUpdate() {
  if (resizeAnimationFrame !== null) return;

  resizeAnimationFrame = window.requestAnimationFrame(() => {
    resizeAnimationFrame = null;
    updateOverlayScale();
  });
}

function updateParticleCanvasResolution() {
  canvasRenderScale = clamp(CONFIG.render.canvasRenderScale || 1, 0.35, 1);

  const targetWidth = Math.round(CONFIG.design.width * canvasRenderScale);
  const targetHeight = Math.round(CONFIG.design.height * canvasRenderScale);

  if (canvas.width !== targetWidth) {
    canvas.width = targetWidth;
  }

  if (canvas.height !== targetHeight) {
    canvas.height = targetHeight;
  }

  ctx.setTransform(canvasRenderScale, 0, 0, canvasRenderScale, 0, 0);
}


/* =========================================================
   05. UTILITY FUNCTIONS
========================================================= */

function randomBetween(min, max) {
  return min + Math.random() * (max - min);
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}


/* =========================================================
   06. PARTICLE CREATION
========================================================= */

/* =========================================================
   05A. PARTICLE ZONE HELPERS
   ---------------------------------------------------------
   These helpers keep the connected particle network confined
   to the left and right thirds of the 1920x1080 overlay.
========================================================= */

function getParticleZoneBounds(zone) {
  if (CONFIG.particleNetwork.zoneMode !== "outerThirds") {
    return {
      minX: 0,
      maxX: CONFIG.design.width
    };
  }

  const inset = CONFIG.particleNetwork.zoneInset;
  const leftMax =
    CONFIG.design.width * CONFIG.particleNetwork.leftZoneMaxRatio - inset;
  const rightMin =
    CONFIG.design.width * CONFIG.particleNetwork.rightZoneMinRatio + inset;

  if (zone === "left") {
    return {
      minX: inset,
      maxX: leftMax
    };
  }

  return {
    minX: rightMin,
    maxX: CONFIG.design.width - inset
  };
}

function getRandomParticleZone() {
  if (CONFIG.particleNetwork.zoneMode !== "outerThirds") {
    return "full";
  }

  return Math.random() < 0.5 ? "left" : "right";
}


function createParticles() {
  particles = [];

  for (let i = 0; i < CONFIG.particleNetwork.particleCount; i++) {
    const isAccent =
      Math.random() < CONFIG.particleNetwork.accentParticleChance;

    const zone = getRandomParticleZone();
    const bounds = getParticleZoneBounds(zone);

    particles.push({
      zone,
      minX: bounds.minX,
      maxX: bounds.maxX,
      x: randomBetween(bounds.minX, bounds.maxX),
      y: Math.random() * CONFIG.design.height,
      vx: randomBetween(-CONFIG.particleNetwork.speed, CONFIG.particleNetwork.speed),
      vy: randomBetween(-CONFIG.particleNetwork.speed, CONFIG.particleNetwork.speed),
      radius: randomBetween(
        CONFIG.particleNetwork.minRadius,
        CONFIG.particleNetwork.maxRadius
      ),
      pulse: Math.random() * TWO_PI,
      isAccent
    });
  }
}


/* =========================================================
   07. PARTICLE MOVEMENT
========================================================= */

function updateParticles() {
  const height = CONFIG.design.height;

  for (const particle of particles) {
    particle.x += particle.vx;
    particle.y += particle.vy;
    particle.pulse += 0.035;

    if (particle.x < particle.minX) {
      particle.x = particle.minX;
      particle.vx *= -1;
    }

    if (particle.x > particle.maxX) {
      particle.x = particle.maxX;
      particle.vx *= -1;
    }

    if (particle.y < 0) {
      particle.y = 0;
      particle.vy *= -1;
    }

    if (particle.y > height) {
      particle.y = height;
      particle.vy *= -1;
    }
  }
}


/* =========================================================
   08. PARTICLE DOT DRAWING
========================================================= */

function drawParticleDots() {
  const theme = canvasTheme;
  const networkConfig = CONFIG.particleNetwork;
  const baseOpacity = networkConfig.particleBaseOpacity;
  const pulseOpacity = networkConfig.particlePulseOpacity;
  const particleGlowBlur = networkConfig.particleGlowBlur;
  const whiteAccentColor = theme.whiteAccentColor;
  const useParticleGlow = particleGlowBlur > 0;

  if (!useParticleGlow) {
    ctx.shadowBlur = 0;
  }

  for (const particle of particles) {
    const pulse = baseOpacity + Math.sin(particle.pulse) * pulseOpacity;
    const opacity = clamp(pulse, 0.16, 0.92);
    const color = particle.isAccent ? whiteAccentColor : theme.particleColor;

    if (useParticleGlow) {
      ctx.shadowBlur = particleGlowBlur;
      ctx.shadowColor = particle.isAccent
        ? theme.accentShadowColor
        : theme.particleShadowColor;
    }

    if (networkConfig.cheapParticleHalo) {
      ctx.beginPath();
      ctx.arc(
        particle.x,
        particle.y,
        particle.radius * networkConfig.cheapParticleHaloRadiusMultiplier,
        0,
        TWO_PI
      );
      ctx.fillStyle = `rgba(${color}, ${opacity * networkConfig.cheapParticleHaloOpacity})`;
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(particle.x, particle.y, particle.radius, 0, TWO_PI);
    ctx.fillStyle = `rgba(${color}, ${opacity})`;
    ctx.fill();

    /*
      Small center highlight. No shadow in OBS mode; shadow is only used if
      particleGlowBlur is enabled for cinematic mode.
    */
    ctx.beginPath();
    ctx.arc(particle.x, particle.y, particle.radius * 0.36, 0, TWO_PI);
    ctx.fillStyle = `rgba(${whiteAccentColor}, ${opacity * 0.42})`;
    ctx.fill();
  }
}


/* =========================================================
   09. CONNECTING LINE DRAWING
========================================================= */

function drawParticleConnections() {
  const theme = canvasTheme;
  const networkConfig = CONFIG.particleNetwork;
  const maxDistance = networkConfig.connectionDistance;
  const maxDistanceSquared = maxDistance * maxDistance;
  const skipCrossZoneConnections = networkConfig.zoneMode === "outerThirds";
  const useLineGlow = networkConfig.lineGlowBlur > 0;

  ctx.shadowBlur = useLineGlow ? networkConfig.lineGlowBlur : 0;
  ctx.shadowColor = useLineGlow ? theme.lineShadowColor : "transparent";
  ctx.lineWidth = networkConfig.lineWidth;

  for (let i = 0; i < particles.length; i++) {
    const a = particles[i];

    for (let j = i + 1; j < particles.length; j++) {
      const b = particles[j];

      /*
        Outer-thirds mode means opposite-side particles never connect. This
        preserves the visible intent while avoiding unnecessary distance work.
      */
      if (skipCrossZoneConnections && a.zone !== b.zone) {
        continue;
      }

      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const distanceSquared = dx * dx + dy * dy;

      if (distanceSquared < maxDistanceSquared) {
        /*
          OBS optimization: use squared-distance closeness instead of calling
          Math.sqrt for every connected pair every frame.
        */
        const closeness = 1 - distanceSquared / maxDistanceSquared;
        const opacity = networkConfig.lineBaseOpacity + closeness * networkConfig.lineMaxOpacity;
        const hasAccent = a.isAccent || b.isAccent;

        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = hasAccent
          ? `rgba(${theme.whiteAccentColor}, ${opacity * 0.45})`
          : `rgba(${theme.lineColor}, ${opacity})`;
        ctx.stroke();

        drawSignalLine(a, b, closeness, theme, networkConfig);
      }
    }
  }
}


/* =========================================================
   10. OCCASIONAL BRIGHT SIGNAL LINES
========================================================= */

function drawSignalLine(a, b, closeness, theme, networkConfig) {
  if (!networkConfig.signalLinesEnabled) return;

  const shouldDraw =
    Math.random() < networkConfig.signalLineChance * closeness;

  if (!shouldDraw) return;

  ctx.save();

  ctx.shadowBlur = 10;
  ctx.shadowColor = theme.signalShadowColor;
  ctx.lineWidth = networkConfig.signalLineWidth;

  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.strokeStyle = `rgba(${theme.whiteAccentColor}, ${networkConfig.signalLineOpacity})`;
  ctx.stroke();

  ctx.restore();
}


/* =========================================================
   10A. EVE / GALLENTE NOTIFICATION HELPERS
   ---------------------------------------------------------
   Messages are customizable in:
   CONFIG.eveNotifications.messages
========================================================= */

let eveNotificationTimer = null;
let eveMessageDeck = [];
let eveRecentMessageKeys = [];

function getAllowedNotificationSide() {
  const sideSetting = CONFIG.eveNotifications.sides;

  if (sideSetting === "left" || sideSetting === "right") {
    return sideSetting;
  }

  return Math.random() > 0.5 ? "left" : "right";
}

function getActiveNotificationCount() {
  return activeNotificationCount;
}

function getMessageKey(message) {
  return `${message.type || "unknown"}::${message.title || ""}::${message.body || ""}`;
}

function shuffleArray(items) {
  const shuffled = [...items];

  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }

  return shuffled;
}

function rebuildEveMessageDeck(messages) {
  const recentKeys = new Set(eveRecentMessageKeys);
  const preferredMessages = messages.filter((message) => {
    return !recentKeys.has(getMessageKey(message));
  });

  /*
    Prefer messages outside the recent memory window. If the pool somehow
    becomes too small, fall back to the full list so popups keep working.
  */
  eveMessageDeck = shuffleArray(
    preferredMessages.length >= Math.min(8, messages.length)
      ? preferredMessages
      : messages
  );
}

function getRandomEveMessage() {
  const messages = CONFIG.eveNotifications.messages;

  if (!Array.isArray(messages) || messages.length === 0) {
    return {
      type: "gallente",
      title: "FEDERATION RELAY",
      badge: "ONLINE",
      body: "Gallente interface active. No custom messages configured.",
      meta: "DEFAULT MESSAGE"
    };
  }

  if (!CONFIG.eveNotifications.useMessageDeck) {
    return messages[Math.floor(Math.random() * messages.length)];
  }

  if (eveMessageDeck.length === 0) {
    rebuildEveMessageDeck(messages);
  }

  const message = eveMessageDeck.pop();
  const key = getMessageKey(message);

  eveRecentMessageKeys.push(key);

  while (eveRecentMessageKeys.length > CONFIG.eveNotifications.recentMessageMemory) {
    eveRecentMessageKeys.shift();
  }

  return message;
}

function getSafeMessageType(message) {
  if (message && NOTIFICATION_TYPES.has(message.type)) {
    return message.type;
  }

  return "gallente";
}

function createPopupPart(className, text) {
  const element = document.createElement("div");
  element.className = className;
  element.textContent = text || "";
  return element;
}

function buildPopupContent(panel, message) {
  const scan = createPopupPart("eve-popup-scan", "");
  const sweep = createPopupPart("eve-popup-sweep", "");
  const header = createPopupPart("eve-popup-header", "");
  const title = createPopupPart("eve-popup-title", message.title);
  const badge = createPopupPart("eve-popup-badge", message.badge);
  const body = createPopupPart("eve-popup-body", message.body);
  const meta = createPopupPart("eve-popup-meta", message.meta);

  header.append(title, badge);
  panel.append(scan, sweep, header, body, meta);
}

function scheduleNextEveNotification() {
  if (!CONFIG.eveNotifications.enabled) return;

  const delay = randomBetween(
    CONFIG.eveNotifications.spawnIntervalMin,
    CONFIG.eveNotifications.spawnIntervalMax
  );

  eveNotificationTimer = window.setTimeout(() => {
    spawnEveNotification();
    scheduleNextEveNotification();
  }, delay);
}

function spawnEveNotification() {
  if (!CONFIG.eveNotifications.enabled) return;
  if (!eveNotificationLayer) return;

  if (getActiveNotificationCount() >= CONFIG.eveNotifications.maxActivePanels) {
    return;
  }

  const side = getAllowedNotificationSide();
  const message = getRandomEveMessage();
  const type = getSafeMessageType(message);

  const panel = document.createElement("div");
  panel.className = "eve-popup";

  if (CONFIG.eveNotifications.useTypeStyles) {
    panel.classList.add(`type-${type}`);
  }

  if (message.priority || Math.random() < 0.12) {
    panel.classList.add("priority");
  }

  panel.dataset.side = side;
  panel.dataset.type = type;

  const visibleDuration = randomBetween(
    CONFIG.eveNotifications.visibleDurationMin,
    CONFIG.eveNotifications.visibleDurationMax
  );

  const enterDuration = randomBetween(
    CONFIG.eveNotifications.enterDurationMin,
    CONFIG.eveNotifications.enterDurationMax
  );

  const exitDuration = randomBetween(
    CONFIG.eveNotifications.exitDurationMin,
    CONFIG.eveNotifications.exitDurationMax
  );

  const scanDuration = randomBetween(
    CONFIG.eveNotifications.scanDurationMin,
    CONFIG.eveNotifications.scanDurationMax
  );

  const top = randomBetween(
    CONFIG.eveNotifications.topMin,
    CONFIG.eveNotifications.topMax
  );

  panel.style.top = `${top}px`;
  panel.style.left = side === "left"
    ? `${CONFIG.eveNotifications.leftX}px`
    : `${CONFIG.eveNotifications.rightX}px`;
  panel.style.setProperty("--eve-enter-duration", `${enterDuration}ms`);
  panel.style.setProperty("--eve-exit-duration", `${exitDuration}ms`);
  panel.style.setProperty("--eve-panel-scan-duration", `${scanDuration}ms`);

  buildPopupContent(panel, message);

  eveNotificationLayer.appendChild(panel);
  activeNotificationCount += 1;

  /*
    Let the browser commit the starting opacity/transform without forcing
    synchronous layout, then snap the panel into the visible state.
  */
  window.requestAnimationFrame(() => {
    if (panel.isConnected) {
      panel.classList.add("is-visible");
    }
  });

  window.setTimeout(() => {
    panel.classList.remove("is-visible");
    panel.classList.add("is-hiding");
  }, visibleDuration);

  window.setTimeout(() => {
    panel.remove();
    activeNotificationCount = Math.max(0, activeNotificationCount - 1);
  }, visibleDuration + exitDuration + 80);
}

function initializeEveNotifications() {
  if (!CONFIG.eveNotifications.enabled) {
    if (eveNotificationTimer) {
      window.clearTimeout(eveNotificationTimer);
    }

    return;
  }

  /*
    First notification appears quickly enough to confirm the feature is working,
    then the normal randomized timing takes over.
  */
  window.setTimeout(spawnEveNotification, 900);
  scheduleNextEveNotification();
}


/* =========================================================
   11. MAIN ANIMATION LOOP
========================================================= */

function animate(timestamp = 0) {
  const targetFps = Math.max(1, CONFIG.render.targetFps || 30);
  const frameInterval = 1000 / targetFps;

  if (!overlayPaused && timestamp - lastAnimationTime >= frameInterval) {
    lastAnimationTime = timestamp;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(canvasRenderScale, 0, 0, canvasRenderScale, 0, 0);

    if (CONFIG.particleNetwork.enabled && CONFIG.visual.performanceMode !== "static") {
      updateParticles();
      drawParticleConnections();
      drawParticleDots();
    }
  }

  requestAnimationFrame(animate);
}


/* =========================================================
   12. INITIALIZATION
========================================================= */

window.addEventListener("resize", requestOverlayScaleUpdate, { passive: true });

document.addEventListener("visibilitychange", () => {
  if (!CONFIG.render.pauseWhenDocumentHidden) return;
  overlayPaused = document.hidden;
});

applyVisualMode();
updateOverlayScale();
updateParticleCanvasResolution();
createParticles();
initializeEveNotifications();
animate();
</script>
</body>
